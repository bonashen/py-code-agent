[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-code-agent-plan-orchestrator"
version = "0.1.0"
description = "Plan Orchestrator plugin for Py Code Agent - advanced task orchestration with dynamic resource allocation and priority scheduling"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Py Code Agent Team", email = "team@pycodeagent.dev"}
]
keywords = ["py-code-agent", "plugin", "orchestrator", "task-scheduling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = []

[project.entry-points."py_code_agent.plugins"]
plan_orchestrator = "py_code_agent_plan_orchestrator:AdvancedOrchestrator"

[tool.hatch.build.targets.wheel]
packages = ["py_code_agent_plan_orchestrator"]