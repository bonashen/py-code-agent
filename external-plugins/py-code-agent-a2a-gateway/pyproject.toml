[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-code-agent-a2a-gateway"
version = "0.1.0"
description = "A2A Gateway plugin for Py Code Agent - enables agent-to-agent communication via A2A v0.3.0 protocol"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Py Code Agent Team", email = "team@pycodeagent.dev"}
]
keywords = ["py-code-agent", "plugin", "a2a", "agent-to-agent", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
gateway = [
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.entry-points."py_code_agent.plugins"]
a2a_gateway = "py_code_agent_a2a_gateway.plugin:A2AGatewayPlugin"

[tool.hatch.build.targets.wheel]
packages = ["py_code_agent_a2a_gateway"]