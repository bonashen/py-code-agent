[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-code-agent-omo"
version = "0.1.0"
description = "Oh My OpenCode plugin collection for Py Code Agent — multi-model orchestration, parallel sub-agents, intent gate, and discipline enforcement"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Py Code Agent Team", email = "team@pycodeagent.dev"}
]
keywords = ["py-code-agent", "plugin", "omo", "multi-model", "orchestration", "sub-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.entry-points."py_code_agent.plugins"]
intent-gate = "py_code_agent_omo.plugins.intent_gate:IntentGatePlugin"
category-router = "py_code_agent_omo.plugins.category_router:CategoryRouterPlugin"
subagent = "py_code_agent_omo.plugins.subagent:SubAgentPlugin"
discipline = "py_code_agent_omo.plugins.discipline:DisciplinePlugin"
comment-checker = "py_code_agent_omo.plugins.comment_checker:CommentCheckerPlugin"
think-mode = "py_code_agent_omo.plugins.think_mode:ThinkModePlugin"

[tool.hatch.build.targets.wheel]
packages = ["py_code_agent_omo"]
