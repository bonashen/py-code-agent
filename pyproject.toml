[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-code-agent"
version = "0.1.0"
description = "Py Code Agent - AI Coding Assistant with LiteLLM"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Py Code Agent Team"}
]
keywords = ["ai", "coding", "agent", "llm", "assistant", "litellm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    # Core - LLM
    "litellm>=1.0.0",  # Unified LLM API for 100+ providers
    # CLI and UI
    "rich>=13.0.0",
    "textual>=0.41.0",
    "click>=8.0.0",
    # Data Validation
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # HTTP and API
    "httpx>=0.25.0",
    "aiohttp>=3.9.0",
    # Plugin System
    "pluggy>=1.3.0",
    # File and Code Handling
    "aiofiles>=23.0.0",
    "pyyaml>=6.0.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
    "orjson>=3.9.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    # Package Manager (for fast plugin installs)
    "uv>=0.1.0",
]

[project.optional-dependencies]
all = [
    "tree-sitter>=0.20.0",
    "watchdog>=3.0.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
]
gateway = [
    "uvicorn>=0.24.0",
    "fastapi>=0.104.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.5.0",
]

[project.scripts]
py-code-agent = "py_code_agent.cli.main:main"

[project.entry-points."py_code_agent.plugins"]
# Plugin entry point group - PyPI-published plugins register themselves here
# Example: my-plugin = "my_package.plugin:register"

[project.urls]
Homepage = "https://github.com/your-org/py-code-agent"
Documentation = "https://py-code-agent.readthedocs.io"
Repository = "https://github.com/your-org/py-code-agent.git"
Issues = "https://github.com/your-org/py-code-agent/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/py_code_agent"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "full_agent: marks tests that require real Agent (slow, ~14s litellm import)",
]
